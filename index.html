<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>lazy-list</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body class="bg-stone-200 relative">
    <div
      class="flex justify-between p-2 shadow items-center bg-white z-10 relative"
    >
      <h1>Lazy List</h1>
      <div
        class="flex gap-2 items-center justify-center hover:cursor-pointer hover:bg-stone-300 p-2 rounded-xl"
        id="user-btn"
      >
        <div
          class="flex items-center justify-center bg-stone-400 rounded-full p-1"
        >
          <i data-lucide="user" class="h-5 w-5"></i>
        </div>
        <div class="text-sm" id="user">Login</div>
      </div>
    </div>

    <div class="hidden fixed bg-stone-600 h-full w-full z-20 " id="login-form">
      <div class="w-full h-full flex justify-center items-center" id="out-box">
        <div class="flex flex-col gap-2 p-2 w-full md:w-xl mx-5 rounded-xl bg-white">
          <h2 class="text-sm">Login</h2>
          <input
            id="username"
            placeholder="Masukkan username"
            class="border border-stone-200 rounded-sm px-2 py-1 " 
          />
          <button
            id="btnLogin"
            class="bg-blue-600 text-white px-2 py-1 rounded-sm hover:bg-blue-800 hover:cursor-pointer"
          >
            Login cuy
          </button>
        </div>
      </div>
    </div>

    <script src="/main.js" type="module"></script>
  </body>
</html>
