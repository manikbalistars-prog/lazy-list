<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>lazy-list</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body class="bg-stone-200 relative">
    <div
      class="flex justify-between p-2 shadow items-center bg-white z-10 fixed w-full"
    >
      <div class="flex gap-2 items-center justify-center">
        <h1>Lazy List</h1>
        <button
          class="bg-blue-400 px-2 py-0.5 rounded-full text-sm text-white hover:cursor-pointer hover:bg-blue-600"
          id="add-btn"
        >
          add
        </button>
      </div>
      <div
        class="flex gap-2 items-center justify-center hover:cursor-pointer hover:bg-stone-300 p-2 rounded-xl"
        id="user-btn"
      >
        <div
          class="flex items-center justify-center bg-stone-400 rounded-full p-1"
        >
          <i data-lucide="user" class="h-5 w-5"></i>
        </div>
        <div class="text-sm" id="user">Login</div>
      </div>
    </div>

    <div
      class="hidden fixed bg-stone-950/30 h-full w-full z-20"
      id="login-form"
    >
      <div class="w-full h-full flex justify-center items-center" id="out-box">
        <div
          class="flex flex-col gap-2 p-2 w-full md:w-xl mx-5 rounded-xl bg-white"
        >
          <h2 class="text-sm">Login</h2>
          <input
            id="username"
            placeholder="Masukkan username"
            class="border border-stone-200 rounded-sm px-2 py-1"
          />
          <button
            id="btnLogin"
            class="bg-blue-600 text-white px-2 py-1 rounded-sm hover:bg-blue-800 hover:cursor-pointer"
          >
            Login cuy
          </button>
        </div>
      </div>
    </div>

    <div
      class="hidden fixed bg-stone-950/30 h-full w-full z-20"
      id="create-form"
    >
      <div class="w-full h-full flex justify-center items-center" id="out-box">
        <div
          class="flex flex-col gap-2 p-2 w-full md:w-xl mx-5 rounded-xl bg-white"
        >
          <h2 class="text-sm text-center">only atmin</h2>
          <label for="create-username">username</label>
          <input
            id="create-username"
            name="create-username"
            placeholder="Masukkan username"
            class="border border-stone-200 rounded-sm px-2 py-1"
          />
          <label for="create-name">name</label>
          <input
            id="create-name"
            name="create-name"
            placeholder="Masukkan username"
            class="border border-stone-200 rounded-sm px-2 py-1"
          />
          <button
            id="btnSubmit"
            class="bg-blue-600 text-white px-2 py-1 rounded-sm hover:bg-blue-800 hover:cursor-pointer"
          >
            add
          </button>
        </div>
      </div>
    </div>

    <div class="bg-stone-950/35 w-screen h-screen z-90 relative flex justify-center items-center " id="loader">
      <span class="loader"></span>
    </div>

    <script src="/main.js" type="module"></script>
  </body>
</html>
